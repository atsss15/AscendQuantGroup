# Fly.io deployment: one always-on machine with a volume for the data.
# The app name must be unique on Fly; change it if `fly apps create` says it's taken.
app = "ascend-exchange"
primary_region = "iad"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/platform.json"
    timeout = "5s"

[mounts]
  source = "ascend_data"
  destination = "/app/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

# overflow room if many players import pandas at once (scale up with: fly scale memory 2048)
swap_size_mb = 1024
